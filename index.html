  <div id="toast" class="toast fixed z-50 bottom-5 left-1/2 rounded-2xl border border-yellow-200/50 bg-[#132752] px-5 py-3 text-center font-bold text-yellow-100 shadow-2xl" aria-live="polite"></div>

     <button data-template-id="reset-cancel" type="button" onclick="cancelExamReset()" class="canva-button main-btn rounded-xl px-4 py-2"></button><button data-template-id="reset-confirm" type="button" onclick="confirmExamReset()" class="canva-button main-btn rounded-xl px-4 py-2 bg-yellow-300 text-[#07112b]"></button>

  <script>
    const defaultState={total_exp:0,level:1,completed_concepts:0,completed_experiments:0,solved_questions:0,correct_answers:0,earned_badges:"",completed_puzzles:0,last_activity:""};
    let state={...defaultState},record=null,dataReady=false;
    const rewards=new Set();
    function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2600)}
    function renderStats(){document.getElementById("hud-exp").textContent=state.total_exp+" EXP"}
    async function saveChanges(changes){state={...state,...changes,last_activity:new Date().toISOString(),level:Math.min(5,Math.floor((changes.total_exp??state.total_exp)/200)+1)};renderStats();if(!dataReady)return;const output=record?await window.dataSdk.update({...record,...state}):await window.dataSdk.create(state);if(!output.isOk)toast("학습 기록을 저장하지 못했어요.")}
    function award(key,amount,changes,message){if(rewards.has(key))return;rewards.add(key);saveChanges({...changes,total_exp:state.total_exp+amount});toast("+"+amount+" EXP · "+message)}
    const handler={onDataChanged(data){record=data[0]||null;if(record)state={...defaultState,...record};renderStats()}};
    async function initData(){const result=await window.dataSdk.init(handler);dataReady=result.isOk;if(!result.isOk)toast("학습 기록을 연결하지 못했어요.")}
    function showView(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));if(id==="generation")setStaticLessonStep(1);if(id==="energy"){resetCircuitBuilder();setupQuiz()}if(id==="magnet"){electromagnetOn=false;updateElectromagnetUI()}if(id==="exam")renderExam();window.scrollTo({top:0,behavior:"smooth"})}

    let staticStep=1;
    const staticData=[null,["마찰 전 · 전기적으로 중성","마찰하기 전에는 두 물체의 (+)전하와 (−)전하가 균형을 이루어 전기적으로 중성입니다."],["마찰 시작 · 전자가 움직일 준비","두 물체를 마찰하면 전자가 한 물체에서 다른 물체로 이동할 수 있습니다."],["마찰 중 · 전자 이동","이 실험에서는 털가죽의 전자가 빨대로 이동합니다."],["마찰 후 · 빨대는 −, 털가죽은 +","빨대는 전자를 얻어 (−)전하를 띠고, 털가죽은 전자를 잃어 (+)전하를 띱니다."]];
    const pattern=[["plus",12,18],["minus",30,18],["plus",48,18],["minus",66,18],["plus",84,18],["minus",21,45],["plus",39,45],["minus",57,45],["plus",75,45],["plus",12,72],["minus",30,72],["plus",48,72],["minus",66,72],["plus",84,72]];
    function particle(parent,sign,x,y,moving=false){const p=document.createElement("div");p.className="charge-particle "+sign+(moving?" moving":"");p.textContent=sign==="minus"?"−":"+";p.style.left=x+"%";p.style.top=y+"%";parent.appendChild(p)}
    function renderCharges(id,extra=null,moving=false){const box=document.getElementById(id);box.innerHTML="";pattern.forEach(([s,x,y])=>particle(box,s,x,y,moving&&s==="minus"));if(extra)for(let i=0;i<5;i++)particle(box,extra,18+i*16,32+(i%2)*25)}
    function setStaticLessonStep(step){staticStep=step;document.getElementById("static-step-number").textContent=step;document.getElementById("static-step-title").textContent=staticData[step][0];document.getElementById("static-caption").textContent=staticData[step][1];document.querySelectorAll(".lesson-dot").forEach((b,i)=>b.classList.toggle("active",i===step-1));document.querySelector('[data-template-id="static-next-button"]').textContent=step===4?"처음부터 다시 ↺":"다음 단계 →";const fur=document.getElementById("fur-charge"),straw=document.getElementById("straw-charge");if(step<3){fur.textContent="중성 · (+)와 (−)가 같음";straw.textContent="중성 · (+)와 (−)가 같음";renderCharges("fur-particles",null,step===2);renderCharges("straw-particles")}else if(step===3){fur.textContent="전자(−)가 빠져나가는 중";straw.textContent="전자(−)가 들어오는 중";renderCharges("fur-particles",null,true);renderCharges("straw-particles","minus")}else{fur.textContent="+전하 · (+)가 더 많음";straw.textContent="−전하 · (−)가 더 많음";renderCharges("fur-particles","plus");renderCharges("straw-particles","minus")}}
    function nextStaticLesson(){if(staticStep===4){setStaticLessonStep(1);return}setStaticLessonStep(staticStep+1);if(staticStep===4)award("static",80,{completed_concepts:state.completed_concepts+1},"마찰 전기 학습 완료!")}

    let circuitPlaced=new Map(),draggedPiece=null,placementSeq=0;
    const pieces={battery:["전지","battery-charging"],bulb:["전구","lightbulb"],switch:["스위치","toggle-right"],wire:["전선","cable"],resistor:["저항","rectangle-horizontal"],motor:["모터","fan"]};
    function dragPiece(e){draggedPiece=e.currentTarget.dataset.piece;e.dataTransfer.setData("text/plain",draggedPiece)}
    function allowCircuitDrop(e){e.preventDefault();e.currentTarget.classList.add("dragover")}
    function dropCircuitPiece(e){e.preventDefault();const zone=e.currentTarget;zone.classList.remove("dragover");const piece=e.dataTransfer.getData("text/plain")||draggedPiece;if(!pieces[piece])return;const r=zone.getBoundingClientRect();placePiece(piece,Math.max(55,Math.min(r.width-55,e.clientX-r.left)),Math.max(45,Math.min(r.height-45,e.clientY-r.top)))}
    function placePiece(piece,x,y){document.getElementById("placed-"+piece)?.remove();const el=document.createElement("div");el.id="placed-"+piece;el.className="placed-piece rounded-xl border border-sky-200/30 bg-[#132752] px-3 py-3 min-w-[88px] text-center shadow-lg";el.style.left=x+"px";el.style.top=y+"px";el.innerHTML='<i data-lucide="'+pieces[piece][1]+'" class="w-6 h-6 mx-auto text-yellow-200"></i><b class="block mt-1 text-sm">'+pieces[piece][0]+"</b>";document.getElementById("circuit-dropzone").appendChild(el);circuitPlaced.set(piece,{order:++placementSeq});document.getElementById("builder-empty-message").style.display="none";lucide.createIcons();updateCircuitPreview()}
    function updateCircuitPreview(){const complete=["battery","bulb","switch","wire"].every(x=>circuitPlaced.has(x));[1,2,3,4].forEach(i=>document.getElementById("wire-"+i).setAttribute("stroke",complete?"#f8ef56":"#355d88"))}
    function resetCircuitBuilder(){circuitPlaced.clear();placementSeq=0;document.querySelectorAll(".placed-piece").forEach(x=>x.remove());document.getElementById("builder-empty-message").style.display="";document.getElementById("builder-status").textContent="아직 회로가 완성되지 않았어요.";document.getElementById("circuit-result").classList.remove("show");updateCircuitPreview()}
    function verdict(){const required=["battery","bulb","switch","wire"],missing=required.filter(x=>!circuitPlaced.has(x)),extras=["resistor","motor"].filter(x=>circuitPlaced.has(x));return{ok:!missing.length&&!extras.length,text:!missing.length&&!extras.length?"정답이에요! 전지·스위치·전구·전선이 모두 들어 있습니다. ⚡":"필수 부품: "+(missing.map(x=>pieces[x][0]).join(", ")||"모두 있음")+(extras.length?" · 불필요한 부품: "+extras.map(x=>pieces[x][0]).join(", "):"")}}
    function checkCircuitBuilder(){if(!circuitPlaced.size){document.getElementById("builder-status").textContent="부품을 하나 이상 배치한 뒤 확인해 주세요.";return}const v=verdict(),svg=document.getElementById("circuit-result-svg");svg.innerHTML="";[...circuitPlaced.keys()].forEach((p,i)=>{const x=150+(i%3)*250,y=i<3?110:290;svg.insertAdjacentHTML("beforeend",'<g transform="translate('+x+' '+y+')"><circle cx="0" cy="0" r="28" class="'+(p==="bulb"?"result-bulb":"result-symbol")+'"></circle><text x="0" y="6" class="result-label">'+pieces[p][0]+'</text></g>')});document.getElementById("circuit-result-judgement").textContent=v.text;document.getElementById("circuit-result-judgement").style.color=v.ok?"#74f7bf":"#ff9fb0";document.getElementById("circuit-result").classList.add("show");document.getElementById("builder-status").textContent=v.ok?"정답! 회로 조건을 만족했어요. ⚡":"조건을 다시 확인해 보세요.";if(v.ok)award("circuit",100,{completed_experiments:state.completed_experiments+1},"직접 회로 완성!")}

    const quizBank=[["전구에 불이 켜지려면 어떤 조건이 필요할까요?",["회로가 끊겨 있어야 한다","회로가 닫혀 있어야 한다","전선이 하나만 있어야 한다","스위치가 열려 있어야 한다"],1,"전류가 흐르려면 닫힌 회로가 필요합니다."],["스위치를 열었을 때 일어나는 일은?",["전류가 더 많이 흐른다","회로가 끊어져 전류가 흐르지 않는다","전압이 2배가 된다","전구가 더 밝아진다"],1,"스위치를 열면 회로가 끊어집니다."],["60 W 전구를 10초 동안 사용했다. 소비한 전기에너지는?",["6 J","60 J","600 J","6000 J"],2,"E=Pt이므로 600 J입니다."],["직렬 회로에서 전구 하나가 끊어지면?",["다른 전구도 꺼진다","더 밝아진다","그대로 켜진다","전지가 충전된다"],0,"직렬회로는 한 곳이 끊어지면 전체가 끊어집니다."]];
    let randomSelected=[],randomIndex=0,randomScore=0;
    function setupQuiz(){randomSelected=[...quizBank].sort(()=>Math.random()-.5).slice(0,3);randomIndex=0;randomScore=0;renderQuiz()}
    function renderQuiz(){const q=randomSelected[randomIndex],box=document.getElementById("random-quiz-content");document.getElementById("quiz-score").textContent="문제 "+(randomIndex+1)+" / 3";box.innerHTML="<p>"+(randomIndex+1)+". "+q[0]+'</p><div class="random-options grid grid-cols-2 gap-3 mt-4"></div>';const list=box.querySelector("div");q[1].forEach((text,i)=>{const b=document.createElement("button");b.type="button";b.className="quiz-option";b.textContent=String.fromCharCode(9312+i)+" "+text;b.onclick=()=>answerQuiz(i,b,q,list);list.appendChild(b)})}
    function answerQuiz(choice,button,q,list){[...list.children].forEach(x=>x.disabled=true);const correct=choice===q[2];button.classList.add(correct?"correct":"wrong");if(!correct)list.children[q[2]].classList.add("correct");const expl=document.createElement("div");expl.className="mt-4 p-4 rounded-xl bg-white/[.05]";expl.textContent=(correct?"정답! ":"오답! ")+q[3];const next=document.createElement("button");next.type="button";next.className="main-btn rounded-xl px-4 py-2 mt-3";next.textContent=randomIndex===2?"결과 보기":"다음 문제";next.onclick=()=>{randomIndex++;if(randomIndex<3)renderQuiz();else{document.getElementById("random-quiz-content").innerHTML="<div class='text-center p-8 font-bold'>최종 점수: "+randomScore+" / 3</div>";document.getElementById("quiz-score").textContent="완료 · "+randomScore+" / 3"}};if(correct)randomScore++;document.getElementById("random-quiz-content").append(expl,next)}

    let electromagnetOn=false;const compassPos=[[10,36],[33,21],[72,21],[90,36],[33,79],[72,79],[10,64],[90,64],[50,32],[50,68]],angles=[-145,-115,-65,-35,115,65,145,35,-90,90];
    function createCompasses(){const layer=document.getElementById("compass-needles");if(layer.children.length)return;compassPos.forEach(([x,y],i)=>{const el=document.createElement("div");el.className="compass-holder";el.style.left=x+"%";el.style.top=y+"%";el.innerHTML='<div class="compass-body"><div class="compass-needle"><div class="compass-north"></div><div class="compass-south"></div></div></div>';el.dataset.index=i;layer.appendChild(el)})}
    function updateElectromagnetUI(){const btn=document.getElementById("electromagnet-toggle");btn.textContent=electromagnetOn?"전자석 끄기":"전자석 켜기";btn.classList.toggle("bg-yellow-300",electromagnetOn);btn.classList.toggle("text-[#07112b]",electromagnetOn);document.getElementById("electromagnet-state").textContent=electromagnetOn?"전자석 켜짐 · 나침반이 자기장 방향을 가리킴":"전자석 꺼짐 · 나침반은 위쪽을 가리킴";document.getElementById("field-lines").style.opacity=electromagnetOn?".55":".12";document.querySelectorAll(".compass-holder").forEach(x=>x.querySelector(".compass-needle").style.transform="translate(-50%,-50%) rotate("+(electromagnetOn?angles[Number(x.dataset.index)]:0)+"deg)")};function toggleElectromagnet(){electromagnetOn=!electromagnetOn;updateElectromagnetUI()}

    const baseExam=[["전구에 불이 켜지려면 회로는?",["끊어진 회로","닫힌 회로","전선이 없는 회로","전지가 없는 회로"],1,"전류가 흐르려면 닫힌 회로가 필요합니다."],["스위치를 열면?",["회로가 연결된다","전류가 더 커진다","회로가 끊어진다","전지가 충전된다"],2,"스위치를 열면 전류 통로가 끊어집니다."],["전지의 주된 역할은?",["빛을 낸다","전기 에너지를 공급한다","전류를 측정한다","전선을 절연한다"],1,"전지는 회로에 전기 에너지를 공급합니다."],["직렬 회로에서 전구 하나가 끊어지면?",["더 밝아진다","계속 켜진다","꺼진다","전압이 두 배가 된다"],2,"직렬 회로는 한 곳이 끊어지면 전체가 끊어집니다."],["병렬 회로의 특징은?",["여러 경로로 전류가 흐른다","전구가 하나뿐이다","전지가 필요 없다","스위치가 없다"],0,"병렬 회로에는 여러 전류 경로가 있습니다."]];
    const examBank=Array.from({length:100},(_,i)=>baseExam[i%baseExam.length]);
    let examState={selected:[],answers:Array(20).fill(null),current:0,graded:false,correct:0};
    function newExam(){examState={selected:Array.from({length:100},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,20),answers:Array(20).fill(null),current:0,graded:false,correct:0}}
    function renderExam(){if(!examState.selected.length)newExam();const i=examState.current,q=examBank[examState.selected[i]],ans=examState.answers[i];document.getElementById("exam-qno").textContent=i+1;document.getElementById("exam-question").textContent=q[0];document.getElementById("exam-progress-bar").style.width=((i+1)/20*100)+"%";document.getElementById("exam-score").textContent=examState.graded?"점수 "+examState.correct+" / 20":"아직 미채점";const options=document.getElementById("exam-options");options.innerHTML="";q[1].forEach((text,n)=>{const b=document.createElement("button");b.type="button";b.className="exam-option w-full mt-2";b.textContent=String.fromCharCode(65+n)+". "+text;if(!examState.graded&&ans===n)b.classList.add("selected");if(examState.graded){if(n===q[2])b.classList.add("correct");else if(ans===n)b.classList.add("wrong");b.disabled=true}b.onclick=()=>{if(!examState.graded){examState.answers[i]=n;renderExam()}};options.appendChild(b)});const feedback=document.getElementById("exam-feedback");feedback.style.display=examState.graded?"block":"none";if(examState.graded)feedback.textContent="정답: "+String.fromCharCode(65+q[2])+". "+q[1][q[2]]+" · "+q[3];const grid=document.getElementById("exam-index-grid");grid.innerHTML="";examState.answers.forEach((a,n)=>{const b=document.createElement("button");b.className="exam-index"+(n===i?" current":"");if(examState.graded&&a!==null)b.classList.add(a===examBank[examState.selected[n]][2]?"correct":"wrong");b.textContent=n+1;b.onclick=()=>{examState.current=n;renderExam()};grid.appendChild(b)});document.getElementById("exam-finish").style.display=examState.graded?"block":"none";document.getElementById("exam-finish").textContent="시험 완료! 최종 점수: "+examState.correct+" / 20"}
    function examPrev(){if(examState.current>0){examState.current--;renderExam()}}function examNext(){if(examState.current<19){examState.current++;renderExam()}}function gradeExam(){if(examState.graded)return;examState.correct=examState.answers.reduce((sum,a,i)=>sum+(a===examBank[examState.selected[i]][2]?1:0),0);examState.graded=true;renderExam();toast("시험 채점이 완료되었습니다.")}function resetExam(){document.getElementById("exam-reset-modal").classList.add("show")}function cancelExamReset(){document.getElementById("exam-reset-modal").classList.remove("show")}function confirmExamReset(){cancelExamReset();newExam();renderExam();toast("새로운 20문제가 출제되었습니다.")}
    document.addEventListener("DOMContentLoaded",()=>{lucide.createIcons();createCompasses();setStaticLessonStep(1);updateElectromagnetUI();setupQuiz();renderExam();renderStats();initData();document.getElementById("exam-reset-modal").addEventListener("click",e=>{if(e.target.id==="exam-reset-modal")cancelExamReset()})});
  </script>
