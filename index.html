     <h2 data-template-id="magnet-question-title" class="canva-text font-bold mt-2"></h2>
     <div class="space-y-3 mt-5">
      <button type="button" onclick="answerMagnet(false,this)" class="answer w-full text-left rounded-xl border border-sky-300/20 bg-slate-950/35 p-4"><span data-template-id="magnet-answer-attract" class="canva-text"></span></button> <button type="button" onclick="answerMagnet(true,this)" class="answer w-full text-left rounded-xl border border-sky-300/20 bg-slate-950/35 p-4"><span data-template-id="magnet-answer-repel" class="canva-text"></span></button>
     </div>
     <p id="magnet-feedback" class="mt-5 text-sm text-sky-100/75" aria-live="polite"></p>
    </aside>
   </div>
  </section>
  <div id="toast" class="toast fixed z-50 bottom-5 left-1/2 -translate-x-1/2 rounded-2xl border border-yellow-200/50 bg-[#132752] px-5 py-3 text-center font-bold text-yellow-100 shadow-2xl" aria-live="polite"></div>
  <script src="/_sdk/20ec72cea0cb85e1.editing_sdk.js" integrity="sha512-y1Lf0yXrnk1vqzLs9a/3x3pp+jSvei2Pbl+x/omYgN5b7HqLzMgs5Vx9HdgcQfw7jcDinPHCzHGQ6BsPf/68zQ=="></script>
  <script>
    const defaultState = { total_exp:0, level:1, completed_concepts:0, completed_experiments:0, solved_questions:0, correct_answers:0, earned_badges:"", completed_puzzles:0, last_activity:"" };
    let state = { ...defaultState };
    let record = null;
    let dataReady = false;
    let labParts = new Set();
    let magnetSame = true;
    let magnetAnswered = false;
    const rewards = new Set();

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function renderStats() {
      document.getElementById("hud-exp").textContent = state.total_exp + " EXP";
    }

    async function saveChanges(changes) {
      const total = changes.total_exp !== undefined ? changes.total_exp : state.total_exp;
      const next = { ...state, ...changes, total_exp:total, level:Math.min(5, Math.floor(total / 200) + 1), last_activity:new Date().toISOString() };
      state = next;
      renderStats();
      if (!dataReady) return;
      const result = record ? await window.dataSdk.update({ ...record, ...next }) : await window.dataSdk.create(next);
      if (!result.isOk) showToast("학습 기록을 저장하지 못했어요. 다시 시도해 주세요.");
    }

    function award(key, amount, changes, message) {
      if (rewards.has(key)) return;
      rewards.add(key);
      saveChanges({ ...changes, total_exp:state.total_exp + amount });
      showToast("+" + amount + " EXP · " + message);
    }

    const handler = {
      onDataChanged(data) {
        record = data[0] || null;
        if (record) state = { ...defaultState, ...record };
        renderStats();
      }
    };

    async function initData() {
      const result = await window.dataSdk.init(handler);
      dataReady = result.isOk;
      if (!result.isOk) showToast("학습 기록을 연결하지 못했어요.");
    }

    // 페이지를 이동할 때 호출됩니다. "generation"(전기의 발생) 페이지로 들어올 때마다
    // 정전기 실험을 처음 상태로 초기화합니다.
    function showView(id) {
      document.querySelectorAll(".view").forEach(view => view.classList.toggle("active", view.id === id));
      window.scrollTo({ top:0, behavior:"smooth" });
      if (id === "generation") resetStaticLab();
    }

    // 정전기 실험(빨대·풍선) 상태를 처음 화면으로 되돌리는 함수.
    // 실행 중이던 애니메이션 위치, 상태 문구, 재실행 가능 여부를 모두 초기값으로 리셋합니다.
    function resetStaticLab() {
      const straw = document.getElementById("straw-tool");
      const balloon = document.getElementById("balloon-tool");
      const status = document.getElementById("static-status");

      // 다시 실험 버튼을 누를 수 있도록 실행 상태를 초기화
      straw.dataset.running = "false";

      // 애니메이션 없이 즉시 원래 위치(CSS 클래스 위치)로 되돌리기 위해
      // transition을 잠깐 끈 뒤 인라인 스타일을 제거합니다.
      straw.style.transition = "none";
      straw.style.left = "";
      straw.style.top = "";

      balloon.style.transition = "none";
      balloon.style.right = "";
      balloon.style.bottom = "";

      status.textContent = "";

      // 다음 실험 실행 시에는 다시 부드러운 애니메이션이 보이도록 transition 복구
      requestAnimationFrame(() => {
        straw.style.transition = "";
        balloon.style.transition = "";
      });
    }

    async function runStaticExperiment() {
      const straw = document.getElementById("straw-tool");
      const balloon = document.getElementById("balloon-tool");
      const status = document.getElementById("static-status");
      if (straw.dataset.running === "true") return;
      straw.dataset.running = "true";
      status.textContent = "빨대를 털가죽에 비비는 중…";
      straw.style.transition = "all .7s ease";
      straw.style.left = "17%";
      straw.style.top = "55%";
      await new Promise(resolve => setTimeout(resolve, 800));
      status.textContent = "찰찰찰… 털가죽에 문질러 전기가 생겼어요!";
      straw.style.left = "56%";
      straw.style.top = "48%";
      await new Promise(resolve => setTimeout(resolve, 900));
      balloon.style.transition = "all 1.6s ease";
      balloon.style.right = "25%";
      balloon.style.bottom = "30%";
      status.textContent = "정전기 때문에 풍선이 빨대를 천천히 따라와요!";
      award("static", 80, { completed_concepts:state.completed_concepts + 1 }, "정전기 실험 성공!");
      straw.dataset.running = "false";
    }

    function togglePart(button) {
      const part = button.dataset.part;
      labParts.has(part) ? labParts.delete(part) : labParts.add(part);
      button.classList.toggle("selected", labParts.has(part));
    }

    function checkCircuit() {
      const complete = ["battery","bulb","switch","wire"].every(part => labParts.has(part));
      const feedback = document.getElementById("lab-feedback");
      if (!complete) {
        feedback.textContent = "전지, 전구, 스위치, 전선을 모두 선택해 닫힌 회로를 만들어 보세요.";
        return;
      }
      document.querySelectorAll(".wire-path").forEach(path => path.classList.add("connected"));
      document.getElementById("bulb-glass").classList.add("lit");
      document.getElementById("circuit-status").textContent = "전류가 흐르고 있어요! ⚡";
      feedback.textContent = "실험 성공! 닫힌 회로가 만들어져 전구에 불이 켜졌습니다.";
      award("circuit", 100, { completed_experiments:state.completed_experiments + 1 }, "가상 실험 성공!");
    }

    function setPoles(same) {
      magnetSame = same;
      const rightPole = document.getElementById("right-pole");
      rightPole.textContent = same ? "N" : "S";
      rightPole.className = "w-1/2 " + (same ? "bg-red-500" : "bg-blue-500") + " grid place-items-center font-bold";
      updateMagnet();
    }

    function updateMagnet() {
      const distance = Number(document.getElementById("magnet-distance").value);
      const shift = (50 - distance) * .58;
      document.getElementById("magnet-left").style.transform = "translateX(" + (-shift) + "px)";
      document.getElementById("magnet-right").style.transform = "translateX(" + shift + "px)";
      document.getElementById("magnet-result").textContent = magnetSame ? "같은 극 → 서로 밀어냄" : "다른 극 → 서로 끌어당김";
    }

    function answerMagnet(isRepel, button) {
      if (magnetAnswered) return;
      magnetAnswered = true;
      const correct = isRepel;
      document.querySelectorAll(".answer").forEach(item => item.disabled = true);
      button.classList.add(correct ? "correct" : "wrong");
      const feedback = document.getElementById("magnet-feedback");
      if (correct) {
        feedback.textContent = "정답! 같은 극끼리는 서로 밀어냅니다.";
        award("magnet", 100, { completed_experiments:state.completed_experiments + 1, solved_questions:state.solved_questions + 1, correct_answers:state.correct_answers + 1 }, "자기장 실험 성공!");
      } else {
        feedback.textContent = "아쉬워요. 같은 극끼리는 서로 밀어냅니다.";
        saveChanges({ solved_questions:state.solved_questions + 1 });
      }
    }

    const randomQuizBank = [
      ["전구에 불이 켜지려면 어떤 조건이 필요할까요?",["회로가 끊겨 있어야 한다","회로가 닫혀 있어야 한다","전선이 하나만 있어야 한다","스위치가 항상 열려 있어야 한다"],1,"전류가 흐르려면 전류가 지나가는 길이 완전히 연결된 닫힌 회로여야 합니다."],
      ["전구 A와 B를 직렬로 연결했다. A의 필라멘트가 끊어지면 B는?",["더 밝아진다","그대로 켜진다","꺼진다","깜빡인다"],2,"직렬회로에서는 한 곳이 끊어지면 전체 회로가 끊어져 전류가 흐르지 않습니다."],
      ["같은 시간 동안 40 W와 100 W 전기기구를 사용했다. 전기에너지를 더 많이 소비한 것은?",["40 W","100 W","둘 다 같다","전선에 따라 결정된다"],1,"같은 시간이라면 전력이 큰 기구가 더 많은 전기에너지를 소비합니다."],
      ["스위치를 열었을 때 일어나는 일은?",["전류가 더 많이 흐른다","회로가 끊어져 전류가 흐르지 않는다","전압이 반드시 2배가 된다","전구 밝기가 반드시 2배가 된다"],1,"스위치를 열면 전류가 지나가는 길이 끊어집니다."],
      ["60 W 전구를 10초 동안 사용했다. 소비한 전기에너지는?",["6 J","60 J","600 J","6000 J"],2,"E = Pt이므로 60 W × 10 s = 600 J입니다."],
      ["다음 중 닫힌 회로에 대한 설명으로 옳은 것은?",["반드시 건전지가 2개 있어야 한다","전류가 흐를 수 있는 완전한 통로가 연결되어 있다","스위치가 반드시 열려 있다","전구가 반드시 2개 있어야 한다"],1,"닫힌 회로는 전류가 흐를 수 있도록 통로가 완전히 연결된 상태입니다."],
      ["전구 2개를 직렬로 연결한 회로에서 전구 하나를 제거하면?",["다른 전구가 더 밝아진다","다른 전구도 꺼진다","아무 변화가 없다","건전지가 자동으로 하나 더 생긴다"],1,"전구 하나를 제거하면 직렬회로의 통로가 끊어집니다."],
      ["200 W 전기기구를 5초 동안 사용했다. 소비한 전기에너지는?",["40 J","205 J","1000 J","2000 J"],2,"E = Pt = 200 W × 5 s = 1000 J입니다."],
      ["다음 중 전류의 흐름을 막는 상황은?",["스위치를 닫는다","끊어진 전선을 연결한다","회로의 한 부분이 끊어져 있다","전지를 연결한다"],2,"회로가 한 부분이라도 끊어지면 전류가 흐를 수 있는 통로가 사라집니다."],
      ["100 W와 50 W 기구를 각각 20초 사용했다. 소비한 전기에너지의 차이는?",["500 J","1000 J","1500 J","2000 J"],1,"(100−50) W × 20 s = 1000 J입니다."]
    ];

    let randomSelected = [];
    let randomIndex = 0;
    let randomScore = 0;

    function setupRandomQuiz() {
      const pool = [...randomQuizBank];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      randomSelected = pool.slice(0, 3);
      randomIndex = 0;
      randomScore = 0;
      renderRandomQuiz();
    }

    function renderRandomQuiz() {
      const box = document.getElementById("random-quiz-content");
      const scoreEl = document.getElementById("quiz-score");
      const q = randomSelected[randomIndex];
      if (!q) return;
      scoreEl.textContent = "문제 " + (randomIndex + 1) + " / 3";
      box.innerHTML = "<p class=\"quiz-question\">" + (randomIndex + 1) + ". " + q[0] + "</p><div class=\"random-options quiz-options\"></div>";
      const options = box.querySelector(".random-options");
      q[1].forEach((label, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quiz-option";
        button.textContent = String.fromCharCode(9312 + index) + " " + label;
        button.addEventListener("click", () => answerRandomQuiz(index, button, q, options));
        options.appendChild(button);
      });
    }

    function answerRandomQuiz(choice, button, q, options) {
      [...options.children].forEach(item => item.disabled = true);
      const correct = choice === q[2];
      if (correct) { randomScore++; button.classList.add("correct"); }
      else { button.classList.add("wrong"); options.children[q[2]].classList.add("correct"); }
      const explanation = document.createElement("div");
      explanation.className = "quiz-explanation";
      explanation.innerHTML = "<strong>" + (correct ? "정답! 🎉" : "오답! ❌") + "</strong><br>" + q[3];
      const next = document.createElement("button");
      next.type = "button";
      next.className = "quiz-next";
      next.textContent = randomIndex === 2 ? "결과 보기" : "다음 문제";
      next.addEventListener("click", () => { randomIndex++; randomIndex < 3 ? renderRandomQuiz() : finishRandomQuiz(); });
      document.getElementById("random-quiz-content").append(explanation, next);
      document.getElementById("quiz-score").textContent = "문제 " + (randomIndex + 1) + " / 3 · 현재 점수 " + randomScore;
    }

    function finishRandomQuiz() {
      const box = document.getElementById("random-quiz-content");
      const message = randomScore === 3 ? "완벽해요! 🎉" : randomScore === 2 ? "좋아요! 조금만 더 복습해봐요 👍" : "괜찮아요! 해설을 다시 확인해보세요 💪";
      box.innerHTML = "<div class=\"quiz-result\">" + message + "<br>최종 점수: " + randomScore + " / 3</div>";
      document.getElementById("quiz-score").textContent = "완료 · " + randomScore + " / 3";
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderStats();
      updateMagnet();
      setupRandomQuiz();
      initData();
    });
  </script>
 </body>
